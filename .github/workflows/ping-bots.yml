name: 🚀 Automatic Search Engine Ping & IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📡 Ping Search Engines & IndexNow
        run: python scripts/ping_bots.py
